agents:
  default:
    engine_home: session
    llm: claude-code
    permissions:
      claude-code:
        mode: acceptEdits
    profiles:
      - default
    runtime: host
  developer:
    llm: claude-code
    profiles:
      - developer
    runtime: container-rootless
  implementor:
    engine_home: session
    llm: claude-code
    permissions:
      claude-code:
        mode: bypass
    profiles:
      - developer
    runtime: container-rootless
  orchestrator:
    llm: claude-opus-5-5
    permissions:
      claude-code:
        mode: bypass
    profiles:
      - orchestrator
    runtime: host
auth: token
config:
  use_distilled: true
default_agent: orchestrator
llm:
  configs:
    claude-code:
      model: claude-opus-4-8
      type: claude-code
    claude-fast:
      model: claude-haiku-4-5-20251001
      type: claude-code
    claude-opus-5-5:
      model: claude-opus-5-5
      type: claude-code
  defaults:
    fast: claude-fast
    primary: claude-code
schema_version: 7
