[package]
name = "bosun-host"
version = "0.0.0"
description = "bosun host: OS/arch/distro detection, privilege, Machine impls, backend probe registry."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bosun-core.workspace = true
bosun-ports.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
bzip2.workspace = true
tempfile.workspace = true
ureq.workspace = true

# euid/uid for the Linux privilege check; Windows asks `whoami /groups`. The passwd
# database for the user who elevated a run, and their file I/O done as them:
# nix forks and drops privileges, rustix makes the child's system calls without
# allocating (paths as C strings, SCM_RIGHTS from a stack buffer, pipes and
# dup2 onto the standard streams for a command run as the user).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "net", "pipe", "stdio"] }
nix.workspace = true

[lints]
workspace = true
